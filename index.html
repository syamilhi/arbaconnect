<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArbaConnect - CV Arba'in Logistics ERP</title>
    <meta name="description" content="Enterprise distribution logistics, real-time FEFO stock ledger, B2B CRM, and field sales PWA for CV Arba'in Solo Raya." />
    <meta property="og:title" content="ArbaConnect - CV Arba'in Logistics ERP" />
    <meta property="og:description" content="Enterprise distribution logistics, real-time FEFO stock ledger, B2B CRM, and field sales PWA for CV Arba'in Solo Raya." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Mobile & PWA Full Display Metadata -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#005c55" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Pure Vanilla Stylesheets -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/print.css" />
  </head>
  <body>
    <!-- App Shell Container -->
    <div class="app-wrapper">
      <!-- Fixed Global Header (64px) -->
      <header class="app-header">
        <!-- Brand Identity -->
        <div class="header-brand" id="header-brand-logo" title="Kembali ke Dashboard Eksekutif">
          <svg class="h-8 w-8 object-contain shrink-0" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo ArbaConnect">
            <rect width="36" height="36" rx="9" fill="url(#arbaBrandGrad)" />
            <!-- Herbal Leaf & Logistics Network Nodes Motif -->
            <path d="M10 24C10 24 12 15 21 12C21 12 23 21 14 24C12 25 10 24 10 24Z" fill="#A3FAEF" opacity="0.95" />
            <path d="M12 23C16 19 20 15 25 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
            <circle cx="25" cy="10" r="3" fill="#5BB8FE" stroke="#FFFFFF" stroke-width="1.5" />
            <circle cx="26" cy="22" r="2.2" fill="#FFFFFF" />
            <path d="M17 19L26 22" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2" stroke-linecap="round" />
            <defs>
              <linearGradient id="arbaBrandGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#005C55" />
                <stop offset="1" stop-color="#0F766E" />
              </linearGradient>
            </defs>
          </svg>
          <div class="header-brand-text">
            <span class="brand-title">ArbaConnect</span>
            <span class="brand-subtitle" id="header-brand-subtitle">CV Arba'in Solo Raya</span>
          </div>
        </div>

        <!-- 3-Category Live Quick Search -->
        <div class="header-search">
          <span class="material-symbols-outlined search-icon">search</span>
          <input
            type="text"
            id="global-search-input"
            placeholder="Cari Produk Herbal, Nama Apotek, atau Nomor Faktur..."
            autocomplete="off"
          />
          <button id="search-clear-btn" class="clear-btn hidden" type="button" title="Hapus Pencarian">
            <span class="material-symbols-outlined text-[16px]">close</span>
          </button>
          <div id="global-search-dropdown" class="search-dropdown hidden"></div>
        </div>

        <!-- Header Controls & Actions -->
        <div class="header-actions">
          <!-- Role Perspective Switcher (Khusus Super Admin) -->
          <div class="role-switcher-container" id="role-switcher-wrapper">
            <span class="material-symbols-outlined role-icon">tune</span>
            <select id="role-perspective-select" class="role-select" title=" Simulasi Tampilan Per Divisi (Khusus Super Admin)" aria-label="Simulasi Tampilan Per Divisi">
              <option value="super-admin">Super Admin (Akses Penuh)</option>
              <option value="executive">Direktur &amp; Manajemen</option>
              <option value="field-sales">Sales Lapangan (Aplikasi HP)</option>
              <option value="inventory">Admin Gudang &amp; Stok</option>
              <option value="sales-ops">Admin Penjualan &amp; Faktur</option>
            </select>
            <span class="material-symbols-outlined dropdown-arrow">expand_more</span>
          </div>

          <!-- Online / Local Sync Status Indicator -->
          <button id="header-online-btn" class="online-toggle-btn" type="button" title="Klik untuk beralih mode Online (Server Pusat) / Offline (Lokal IndexedDB)">
            <span id="header-online-dot" class="status-dot online"></span>
            <span id="header-online-text" class="hidden sm:inline">Tersinkron</span>
          </button>

          <!-- Install PWA App Button (shown when installable) -->
          <button id="header-install-pwa-btn" class="icon-btn hidden" type="button" title="Install Aplikasi ArbaConnect (PWA Offline-First)" aria-label="Install Aplikasi PWA">
            <span class="material-symbols-outlined text-[18px]">install_mobile</span>
          </button>

          <!-- Fullscreen Mode Toggle -->
          <button id="header-fullscreen-btn" class="icon-btn" type="button" title="Mode Layar Penuh (Kiosk / F11)" aria-label="Mode Layar Penuh">
            <span id="header-fullscreen-icon" class="material-symbols-outlined text-[18px]">fullscreen</span>
          </button>

          <!-- Dark Mode Toggle -->
          <button id="header-dark-btn" class="icon-btn" type="button" title="Ganti Mode Gelap / Terang">
            <span id="header-dark-icon" class="material-symbols-outlined text-[18px]">dark_mode</span>
          </button>

          <!-- Notification Menu -->
          <div style="position: relative;">
            <button id="header-notif-btn" class="icon-btn" type="button" title="Notifikasi Sistem">
              <span class="material-symbols-outlined text-[18px]">notifications</span>
              <span id="header-notif-badge" class="badge-dot hidden"></span>
            </button>
            <div id="header-notif-menu" class="notification-menu hidden">
              <div class="flex items-center justify-between pb-2 border-b border-border-subtle">
                <span class="font-semibold text-xs text-on-surface">Notifikasi</span>
                <span id="notif-pending-count-label" class="text-xs text-primary font-medium">0 Menunggu</span>
              </div>
              <div id="header-notif-list" class="flex flex-col gap-1.5 py-1 text-xs"></div>
            </div>
          </div>

          <!-- User Profile Pill & Logout Button -->
          <div id="header-profile-pill" class="flex items-center gap-2 pl-2 border-l border-border-subtle cursor-pointer hover:opacity-80 transition-opacity" title="Profil &amp; Pengaturan Akun">
            <div id="header-profile-avatar" class="w-8 h-8 rounded-full bg-primary/10 text-primary border border-primary/20 flex items-center justify-center font-bold text-xs">
              AZ
            </div>
            <div class="hidden xl:flex flex-col text-left">
              <span class="text-xs text-on-surface font-semibold leading-tight">H. Ahmad Zaini, S.E.</span>
              <span class="text-[11px] text-on-surface-variant leading-none">Direktur Operasional</span>
            </div>
          </div>
          <button id="header-logout-btn" class="icon-btn" type="button" title="Keluar" aria-label="Keluar">
            <span class="material-symbols-outlined text-[18px]">logout</span>
          </button>
        </div>
      </header>

      <!-- Dimmed Backdrop for Mobile / Unfolded Sidebar -->
      <div id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>

      <!-- Collapsible App Sidebar (64px collapsed, 256px expanded) -->
      <aside id="app-sidebar" class="app-sidebar collapsed">
        <div class="flex flex-col gap-1 px-2">
          <div class="flex items-center justify-between px-2 py-1 mb-1">
            <span class="sidebar-header-expanded text-on-surface-variant text-[11px] uppercase tracking-wider font-semibold">
              Navigasi Modul
            </span>
            <span class="sidebar-header-collapsed mx-auto text-[10px] text-on-surface-variant uppercase font-semibold">
              Menu
            </span>
          </div>

          <nav class="sidebar-nav">
            <button class="nav-button active" data-path="executive-dashboard" type="button" title="Dasbor">
              <div class="nav-button-content">
                <span class="material-symbols-outlined text-[20px] shrink-0">dashboard</span>
                <span class="nav-label" data-default-label="Dasbor">Dasbor</span>
              </div>
            </button>

            <button class="nav-button" data-path="inventory-stock-ledger" type="button" title="Stok &amp; Gudang">
              <div class="nav-button-content">
                <span class="material-symbols-outlined text-[20px] shrink-0">inventory_2</span>
                <span class="nav-label" data-default-label="Stok &amp; Gudang">Stok &amp; Gudang</span>
              </div>
              <span id="badge-inventory" class="nav-badge-pill hidden">0</span>
            </button>

            <button class="nav-button" data-path="b2b-crm-directory" type="button" title="Mitra Outlet">
              <div class="nav-button-content">
                <span class="material-symbols-outlined text-[20px] shrink-0">store</span>
                <span class="nav-label" data-default-label="Mitra Outlet">Mitra Outlet</span>
              </div>
            </button>

            <button class="nav-button" data-path="order-approval-queue" type="button" title="Verifikasi Order">
              <div class="nav-button-content">
                <span class="material-symbols-outlined text-[20px] shrink-0">fact_check</span>
                <span class="nav-label" data-default-label="Verifikasi Order">Verifikasi Order</span>
              </div>
              <span id="badge-orders" class="nav-badge-pill hidden">0</span>
            </button>

            <button class="nav-button" data-path="field-sales-pwa-preview" type="button" title="Aplikasi Sales">
              <div class="nav-button-content">
                <span class="material-symbols-outlined text-[20px] shrink-0">smartphone</span>
                <span class="nav-label" data-default-label="Aplikasi Sales">Aplikasi Sales</span>
              </div>
            </button>

            <button class="nav-button" data-path="user-management" type="button" title="Manajemen User">
              <div class="nav-button-content">
                <span class="material-symbols-outlined text-[20px] shrink-0">manage_accounts</span>
                <span class="nav-label" data-default-label="Manajemen User">Manajemen User</span>
              </div>
            </button>

            <button class="nav-button" data-path="user-profile-settings" type="button" title="Profil &amp; Keamanan">
              <div class="nav-button-content">
                <span class="material-symbols-outlined text-[20px] shrink-0">person_edit</span>
                <span class="nav-label" data-default-label="Profil &amp; Keamanan">Profil &amp; Keamanan</span>
              </div>
            </button>
          </nav>
        </div>

        <!-- Sidebar Fold / Unfold Control -->
        <div class="sidebar-bottom px-2">
          <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" type="button" title="Buka Menu Samping">
            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
          </button>
        </div>
      </aside>

      <!-- App Content Wrapper -->
      <div id="app-content-wrapper" class="app-content-wrapper">
        <main id="main-view-container" class="main-view-container"></main>

        <!-- Application Footer -->
        <footer class="app-footer">
          <div class="flex items-center gap-2">
            <span class="footer-version">ArbaConnect v3.0.0</span>
            <span>&bull;</span>
            <span>CV Arba'in Solo Raya</span>
          </div>
          <div class="flex items-center gap-4 text-xs">
            <span>Gudang Kartasura</span>
            <span>&bull;</span>
            <span>Standar BPOM &amp; CDOB</span>
          </div>
        </footer>
      </div>
    </div>

    <!-- Modal & Toast Dynamic Mounting Containers -->
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <!-- Pure Vanilla Scripts Loaded in Deterministic Dependency Order -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/offlineSync.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/advancedFeatures.js"></script>
    <script src="js/views/executiveDashboard.js"></script>
    <script src="js/views/inventoryLedger.js"></script>
    <script src="js/views/b2bCrm.js"></script>
    <script src="js/views/orderApproval.js"></script>
    <script src="js/views/fieldSalesPwa.js"></script>
    <script src="js/views/userProfileAndAdmin.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
